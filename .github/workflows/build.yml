name: Build

# Runs on every push to main. Produces a debug APK you can grab from the run's
# artifacts. Releases are cut separately by pushing a tag — see release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The SDK's keyboard is the one dependency this repo does not vendor, and it
      # lives in GitHub Packages behind auth. Without credentials Gradle fails two
      # hundred lines into a stack trace whose last word is "401", which says
      # nothing about which secret is missing or where to put it. An unset secret
      # in Actions is an empty string rather than an error, so nothing else
      # catches this. Lengths are printed, never values: that distinguishes a
      # missing secret from a wrong one without putting either in the log.
      - name: GitHub Packages credentials are present
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -uo pipefail
          missing=0
          if [ -z "${GH_PACKAGES_USER:-}" ]; then
            echo "::error::GH_PACKAGES_USER is not set on this repository."
            missing=1
          fi
          if [ -z "${GH_PACKAGES_TOKEN:-}" ]; then
            echo "::error::GH_PACKAGES_TOKEN is not set on this repository."
            missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::Add both under Settings > Secrets and variables > Actions. The token needs read:packages. Note that gi-os is a personal account, not an organisation, so Actions secrets are per-repository and a new repo inherits nothing from its siblings."
            exit 1
          fi
          echo "ok: user ${#GH_PACKAGES_USER} chars, token ${#GH_PACKAGES_TOKEN} chars"

      - name: Run app checks
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug --stacktrace

      # BrightNonogram v0.1.2 crashed at launch on a Regex the JVM accepted and
      # Android's ICU-backed Pattern rejected — an unescaped closing brace. It
      # compiled, linted and passed every unit test, because the tests run on the
      # JVM. Nothing in this tool needs a regex, so the cheapest fix is to keep
      # it that way.
      - name: No java.util.regex in the tool module
        run: |
          set -euo pipefail
          if grep -rn --include="*.kt" -E "\bRegex\(|Pattern\.compile" tool/src/main; then
            echo "::error::Regex in tool/src/main. Android's Pattern is ICU-backed and rejects patterns OpenJDK accepts, so a JVM-green test proves nothing. Parse by hand, or add an explicit exemption here with a comment saying why the pattern is safe on ICU." >&2
            exit 1
          fi
          echo "ok: no regex in the tool module"

      # The game rules, the solver and the generator carry no Android imports so
      # they can be unit-tested on the JVM. That is the whole reason the test
      # suite can prove every puzzle has one answer, so it is worth a check that
      # nobody has quietly reached for an Android class in there.
      - name: The engine stays free of Android
        run: |
          set -euo pipefail
          if grep -rn --include="*.kt" -E "^import (android|androidx)\." \
              tool/src/main/kotlin/com/gios/brightsudoku/game \
              tool/src/main/kotlin/com/gios/brightsudoku/gen; then
            echo "::error::An Android import in the game or generator packages. Those run under JUnit on the JVM, and every promise about puzzle fairness is tested there." >&2
            exit 1
          fi
          echo "ok: the engine is plain Kotlin"

      - name: Generated SDK registry is in the APK
        # The SDK finds @InitialScreen through a KSP-generated registry that
        # LightActivity loads with Class.forName. If KSP is not wired up the
        # class is simply never generated, the build still succeeds, and the tool
        # crashes the instant it opens.
        run: python3 scripts/check_registry.py tool/build/outputs/apk/debug/tool-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brightsudoku-debug-apk
          path: tool/build/outputs/apk/debug/tool-debug.apk
          if-no-files-found: error
